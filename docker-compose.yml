# Local development only. Ports, commands, healthchecks and Campbell AI defaults
# live in Dockerfile.app / Dockerfile.api (the same images ECS builds); this file
# only adds what is environment-specific: secrets, volumes and published ports.
services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: oil-analysis-dashboard
    env_file:
      - .env # Secrets such as MAPBOX_TOKEN
    volumes:
      # Read the freshly downloaded data from the same path used by the app.
      - ./data:/app/data:ro
      - ./data:/data:ro
      - ./logs:/app/logs
      - ./dashboard:/app/dashboard
      - ./config:/app/config
      - ./src:/app/src
      # Informes preliminares de falla generados (PDF + registro JSON), fuera de la imagen para que sobrevivan al redeploy.
      - ./outputs/informe_falla:/app/outputs/informe_falla
    ports:
      - "8050:8050"
    depends_on:
      campbell-api:
        condition: service_healthy
    restart: unless-stopped

  campbell-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: campbell-ai-api
    env_file:
      - .env
    environment:
      # Real secrets only; declared explicitly so a deployment without them fails
      # visibly instead of silently degrading to the local mirror.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - BUCKET_NAME=${BUCKET_NAME:-}
      - ACCESS_KEY=${ACCESS_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-}
      # Regeneracion semanal del esquema declarado. Corre como un hilo dentro de ESTE
      # proceso, no como un contenedor aparte: duerme hasta su ventana, corre un segundo y
      # publica en el bucket. Por defecto, lunes 08:00 en Chile.
      - CAMPBELL_AI_SCHEMA_REFRESH_ENABLED=${CAMPBELL_AI_SCHEMA_REFRESH_ENABLED:-true}
      - CAMPBELL_AI_SCHEMA_REFRESH_WEEKDAY=${CAMPBELL_AI_SCHEMA_REFRESH_WEEKDAY:-monday}
      - CAMPBELL_AI_SCHEMA_REFRESH_TIME=${CAMPBELL_AI_SCHEMA_REFRESH_TIME:-08:00}
      - CAMPBELL_AI_SCHEMA_REFRESH_TIMEZONE=${CAMPBELL_AI_SCHEMA_REFRESH_TIMEZONE:-America/Santiago}
      - CAMPBELL_AI_SCHEMA_BACKUP_S3=${CAMPBELL_AI_SCHEMA_BACKUP_S3:-true}
      # Donde vive la data del dashboard en el bucket. El documento se publica ahi porque la
      # descarga preserva estructura: esa clave aterriza en `data/auxiliar/` de cada
      # despliegue, que es la copia que el servicio prefiere.
      - CAMPBELL_AI_SCHEMA_DATA_S3_PREFIX=${CAMPBELL_AI_SCHEMA_DATA_S3_PREFIX:-MultiTechnique Alerts/auxiliar}
      # Copias fechadas, fuera del prefijo de la data para que la sincronizacion no las espeje.
      - CAMPBELL_AI_SCHEMA_BACKUP_S3_PREFIX=${CAMPBELL_AI_SCHEMA_BACKUP_S3_PREFIX:-campbellAI/schema/dataset_columns}
    volumes:
      # Solo lectura, como estaba. El refresh escribe la copia generada si puede, y si no
      # publica igual en S3: el documento llega a cada despliegue por la sincronizacion.
      - ./data:/app/data:ro
      # Read-write: holds the feedback log and the local backup mirror.
      - ./logs:/app/logs
      - ./config:/app/config:ro
      - ./src:/app/src:ro
    restart: unless-stopped

  # Particiona consolidated_alerts.csv en Parquet por semana
  # (data/alerts/golden/{client}/{week}/file.parquet), que es lo que leen Alertas >
  # Vista General / Vista Detallada. Corre solo, en primer plano: duerme hasta su ventana
  # (miercoles 04:00 en la zona horaria configurada), regenera las particiones cuyo contenido
  # cambio -incluida la semana en curso- y las sincroniza con S3. Un fallo de S3 queda en el log
  # y se reintenta en la corrida siguiente; las particiones locales siguen siendo validas.
  #
  # Puesta en marcha (en este orden): 1) backfill local, 2) validarlo, 3) backfill con
  # --sync-s3. El sync semanal se niega a correr para un cliente cuyo historial completo no
  # esta en S3:
  #   docker compose run --rm alerts-partitioner python scripts/partition_alerts.py --backfill
  #   docker compose run --rm alerts-partitioner python scripts/partition_alerts.py --backfill --sync-s3
  alerts-partitioner:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: alerts-partitioner
    command: ["python", "scripts/partition_alerts.py", "--schedule"]
    env_file:
      - .env
    environment:
      # Zona horaria en la que se expresa la ventana: explicita, no la del contenedor.
      - ALERT_PARTITIONS_TIMEZONE=${ALERT_PARTITIONS_TIMEZONE:-America/Santiago}
      - ALERT_PARTITIONS_WEEKDAY=${ALERT_PARTITIONS_WEEKDAY:-wednesday}
      - ALERT_PARTITIONS_TIME=${ALERT_PARTITIONS_TIME:-04:00}
      # Mismo bucket/prefijo para el backfill y la corrida semanal. Vacio = BUCKET_NAME y el
      # prefijo del medallion (MultiTechnique Alerts/alerts/golden).
      - ALERT_PARTITIONS_S3_BUCKET=${ALERT_PARTITIONS_S3_BUCKET:-}
      - ALERT_PARTITIONS_S3_PREFIX=${ALERT_PARTITIONS_S3_PREFIX:-}
      - BUCKET_NAME=${BUCKET_NAME:-}
      - ACCESS_KEY=${ACCESS_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-}
    healthcheck:
      disable: true # la imagen trae un healthcheck HTTP del dashboard; este servicio no sirve HTTP
    volumes:
      # Lectura y escritura: es el unico servicio que escribe las particiones.
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
