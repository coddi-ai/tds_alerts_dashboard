services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oil-analysis-dashboard
    env_file:
      - .env  # Load environment variables from .env file
    environment:
      # Campbell AI settings are NOT baked into the image. Every knob has a working
      # default in src/campbell_ai/config.py; set one in .env, or add a line here, to
      # change it — see .env.example for the full list.
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8050
      - CAMPBELL_AI_API_URL=http://campbell-api:8000
      # Shared secret with campbell-api. Both services read the same variable, so they
      # cannot drift apart; the default keeps a local `docker compose up` working. The
      # API is only reachable on the compose network and is never published to the
      # host, so a well-known default here is low exposure — but set
      # CAMPBELL_AI_INTERNAL_TOKEN in .env for any real deployment.
      - CAMPBELL_AI_INTERNAL_TOKEN=${CAMPBELL_AI_INTERNAL_TOKEN:-campbell-internal-service-token}
      # Progressive answers over SSE. Must match the value the API sees, or the browser
      # opens a stream the service will refuse.
      - CAMPBELL_AI_STREAMING=${CAMPBELL_AI_STREAMING:-true}
      # MAPBOX_TOKEN will be read from .env file
      # Or set explicitly: MAPBOX_TOKEN=${MAPBOX_TOKEN}
    volumes:
      # Read the freshly downloaded data from the same path used by the app.
      - ./data:/app/data:ro
      - ./data:/data:ro
      - ./logs:/app/logs
      - ./dashboard:/app/dashboard
      - ./config:/app/config
      - ./src:/app/src
    ports:
      - "8050:8050"
    depends_on:
      campbell-api:
        condition: service_healthy
    restart: unless-stopped

  campbell-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campbell-ai-api
    command: ["uvicorn", "src.campbell_ai.api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      # Campbell AI settings default from src/campbell_ai/config.py, not from the
      # image. Only what this deployment actually changes belongs here; the rest is
      # listed in .env.example.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Same value as the dashboard service above — this pair is the trust boundary
      # between the two containers and must match.
      - CAMPBELL_AI_INTERNAL_TOKEN=${CAMPBELL_AI_INTERNAL_TOKEN:-campbell-internal-service-token}
      - CAMPBELL_AI_STREAMING=${CAMPBELL_AI_STREAMING:-true}
      # Durable conversation and feedback backup. Declared explicitly so a deployment
      # without these values fails visibly here instead of silently degrading to the
      # local mirror inside the container.
      - BUCKET_NAME=${BUCKET_NAME:-}
      - ACCESS_KEY=${ACCESS_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-}
    volumes:
      - ./data:/app/data:ro
      # Read-write: holds the feedback log and the local backup mirror.
      - ./logs:/app/logs
      - ./config:/app/config:ro
      - ./src:/app/src:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/api/v1/campbell-ai/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  campbell-schema-refresh:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campbell-ai-schema-refresh
    command: ["python", "-m", "src.campbell_ai.schema.refresh"]
    env_file:
      - .env
    environment:
      # Runs in the same deployment as the API and reads the same mounted data.
      # Defaults to Monday 08:00 in Chile; override these without changing code.
      - CAMPBELL_AI_SCHEMA_DATA_ROOT=/app/data
      - CAMPBELL_AI_SCHEMA_REFRESH_WEEKDAY=${CAMPBELL_AI_SCHEMA_REFRESH_WEEKDAY:-monday}
      - CAMPBELL_AI_SCHEMA_REFRESH_TIME=${CAMPBELL_AI_SCHEMA_REFRESH_TIME:-08:00}
      - CAMPBELL_AI_SCHEMA_REFRESH_TIMEZONE=${CAMPBELL_AI_SCHEMA_REFRESH_TIMEZONE:-America/Santiago}
      - CAMPBELL_AI_SCHEMA_REFRESH_RUN_ON_START=${CAMPBELL_AI_SCHEMA_REFRESH_RUN_ON_START:-false}
      - CAMPBELL_AI_SCHEMA_BACKUP_S3=${CAMPBELL_AI_SCHEMA_BACKUP_S3:-true}
      # Donde vive la data del dashboard en el bucket. El documento se publica ahi porque la
      # descarga preserva estructura: esta clave aterriza en `data/auxiliar/` de cada
      # despliegue, que es la copia que el servicio prefiere.
      - CAMPBELL_AI_SCHEMA_DATA_S3_PREFIX=${CAMPBELL_AI_SCHEMA_DATA_S3_PREFIX:-MultiTechnique Alerts/auxiliar}
      # Copias fechadas, fuera del prefijo de la data para que la sincronizacion no las espeje.
      - CAMPBELL_AI_SCHEMA_BACKUP_S3_PREFIX=${CAMPBELL_AI_SCHEMA_BACKUP_S3_PREFIX:-campbellAI/schema/dataset_columns}
      - CAMPBELL_AI_SCHEMA_BACKUP_AWS_REGION=${CAMPBELL_AI_SCHEMA_BACKUP_AWS_REGION:-us-east-1}
      - BUCKET_NAME=${BUCKET_NAME:-}
      - ACCESS_KEY=${ACCESS_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-}
    volumes:
      # Read-write by design: this process owns the generated schema file, and that file
      # lives with the data it describes — `/app/data/auxiliar/dataset_columns.json`, beside
      # `manifest.json`. The API mounts this same directory read-only and prefers that copy
      # over the one committed in the image.
      - ./data:/app/data
      # Read-only on purpose. The copy under `src/campbell_ai/schema/` is versioned: it is the
      # reviewed record of how the schema changes between releases, and is the fallback when
      # the generated one is missing. A scheduled process must never rewrite it.
      - ./src:/app/src:ro
    restart: unless-stopped
