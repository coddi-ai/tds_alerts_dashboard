# Local development only. Ports, commands, healthchecks and Campbell AI defaults
# live in Dockerfile.app / Dockerfile.api (the same images ECS builds); this file
# only adds what is environment-specific: secrets, volumes and published ports.
services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: oil-analysis-dashboard
    env_file:
      - .env  # Secrets such as MAPBOX_TOKEN
    volumes:
      # Read the freshly downloaded data from the same path used by the app.
      - ./data:/app/data:ro
      - ./data:/data:ro
      - ./logs:/app/logs
      - ./dashboard:/app/dashboard
      - ./config:/app/config
      - ./src:/app/src
    ports:
      - "8050:8050"
    depends_on:
      campbell-api:
        condition: service_healthy
    restart: unless-stopped

  campbell-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: campbell-ai-api
    env_file:
      - .env
    environment:
      # Real secrets only; declared explicitly so a deployment without them fails
      # visibly instead of silently degrading to the local mirror.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - BUCKET_NAME=${BUCKET_NAME:-}
      - ACCESS_KEY=${ACCESS_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-}
    volumes:
      - ./data:/app/data:ro
      # Read-write: holds the feedback log and the local backup mirror.
      - ./logs:/app/logs
      - ./config:/app/config:ro
      - ./src:/app/src:ro
    restart: unless-stopped
